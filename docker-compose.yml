services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    command: gunicorn koboapi.wsgi:application --bind 0.0.0.0:8000 --workers 2
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: celery -A koboapi worker --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  flower:
    build: .
    command: celery -A koboapi flower --port=5555
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    env_file: .env
    depends_on:
      - redis
      - worker
    restart: unless-stopped
